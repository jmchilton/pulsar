name: pulsar
# SPIKE round 4 — is the resilience suite any flakier on 24.04 than on 22.04?
# Same commit, same everything, only runs-on differs. -x dropped so we see the
# full set of failures on each rather than stopping at the first.
on: [push]
permissions: {}
jobs:
  resilience:
    name: Resilience on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install test runner deps
      run: pip install pytest pytest-timeout requests
    - name: Build images
      run: docker compose -f test/resilience/docker-compose.yml build
    - name: Bring up the docker-compose stack
      run: docker compose -f test/resilience/docker-compose.yml up -d
    - name: Wait for stack
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8474/version >/dev/null; then
            echo "stack ready"; exit 0;
          fi
          sleep 2
        done
        echo "stack did not become ready" >&2
        exit 1
    - name: Run resilience suite
      run: pytest test/resilience -v --keep-stack
      env:
        PYTHONUNBUFFERED: "1"
    - name: Tear down
      if: always()
      run: docker compose -f test/resilience/docker-compose.yml down -v
